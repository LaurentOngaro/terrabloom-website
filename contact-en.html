<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact TerraBloom" />
    <title>Contact - TerraBloom</title>
    <link rel="icon" href="favicon.png" sizes="512x512" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Google reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LeL5kEsAAAAAI2cHJPrsmnmbxBFKrneQRXaOma3"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <section class="contact">
        <div class="contact-container">
          <h1>Contact Us</h1>
          <p class="contact-intro">
            Have a question or comment ?<br />
            Feel free to reach out to us.
          </p>

          <form action="https://formspree.io/f/mojvrgqj" method="POST">
            <div id="form-error" class="form-error" style="display: none"></div>

            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" required />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>

            <button type="submit" class="form-submit">Send</button>
          </form>

          <div class="mt-4 text-center">
            <h2>Other ways to reach us</h2>
            <p>
              <a href="https://x.com/LaurentOngaro" target="_blank">Twitter/X</a> •
              <a href="https://github.com/LaurentOngaro" target="_blank">GitHub</a> •
              <a href="https://www.patreon.com/LaurentOngaro" target="_blank">Patreon</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
